request_api:
  fields:
    device_id:
      selector:
        device:
          filter:
            integration: keenetic_control
    entry_id:
      selector:
        config_entry:
          integration: keenetic_control
    method:
      required: true
      selector:
        select:
          options:
            - GET
            - POST
    endpoint:
      required: true
      selector:
        text: {}
    data_json:
      selector:
        text:
          multiline: true

list_sms:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: keenetic_control

mark_sms_read:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: keenetic_control
    sms_id:
      required: true
      selector:
        text: {}

delete_sms:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: keenetic_control
    sms_id:
      required: true
      selector:
        text: {}

send_ussd:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: keenetic_control
    request:
      required: true
      selector:
        text: {}

send_sms:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: keenetic_control
    message:
      required: true
      selector:
        text:
          multiline: true
    recipient:
      selector:
        text: {}
