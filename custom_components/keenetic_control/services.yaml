request_api:
  target:
    device: {}
  fields:
    entry_id:
      selector:
        config_entry:
          integration: keenetic_control
    method:
      required: true
      selector:
        select:
          options:
            - GET
            - POST
    endpoint:
      required: true
      selector:
        text: {}
    data_json:
      selector:
        text:
          multiline: true

list_sms:
  target:
    device:
      integration: keenetic_control

mark_sms_read:
  target:
    device:
      integration: keenetic_control
  fields:
    sms_id:
      required: true
      selector:
        text: {}

delete_sms:
  target:
    device:
      integration: keenetic_control
  fields:
    sms_id:
      required: true
      selector:
        text: {}

send_ussd:
  target:
    device:
      integration: keenetic_control
  fields:
    request:
      required: true
      selector:
        text: {}

send_sms:
  target:
    device:
      integration: keenetic_control
  fields:
    message:
      required: true
      selector:
        text:
          multiline: true
    recipient:
      selector:
        text: {}
